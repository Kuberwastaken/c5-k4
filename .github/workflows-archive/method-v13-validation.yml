name: Validate Method v1.3 protocol

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/method-v13-validation.yml
      - METHOD_V1_3_BENCHMARK.md
      - schemas/*v1.3*.json
      - scripts/*v13*.py
      - results/benchmark/v1.3-*/**
      - tools/benchmark-drand/*v13*
      - tools/benchmark-drand/test/*v13*
      - tools/benchmark-drand/test/fixtures/**
      - tools/benchmark-drand/package.json
      - tools/benchmark-drand/package-lock.json
  pull_request:
    paths:
      - .github/workflows/method-v13-validation.yml
      - METHOD_V1_3_BENCHMARK.md
      - schemas/*v1.3*.json
      - scripts/*v13*.py
      - results/benchmark/v1.3-*/**
      - tools/benchmark-drand/*v13*
      - tools/benchmark-drand/test/*v13*
      - tools/benchmark-drand/test/fixtures/**
      - tools/benchmark-drand/package.json
      - tools/benchmark-drand/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: method-v13-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.9'

      - name: Install pinned validator dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            attrs==24.2.0 \
            jsonschema==3.2.0 \
            pyrsistent==0.20.0 \
            setuptools==75.8.0 \
            six==1.16.0

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: tools/benchmark-drand/package-lock.json

      - name: Install pinned drand verifier dependencies
        shell: bash
        working-directory: tools/benchmark-drand
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile every Method v1.3 Python module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(
            find scripts -maxdepth 1 -type f -name '*v13*.py' -print | LC_ALL=C sort
          )
          if (( ${#python_files[@]} == 0 )); then
            echo 'no Method v1.3 Python modules found' >&2
            exit 2
          fi
          python -m py_compile "${python_files[@]}"

      - name: Run every Method v1.3 Python test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(
            find scripts -maxdepth 1 -type f -name 'test_*v13*.py' -print | LC_ALL=C sort
          )
          if (( ${#test_files[@]} == 0 )); then
            echo 'no Method v1.3 Python tests found' >&2
            exit 2
          fi
          printf 'discovered %d Method v1.3 Python tests\n' "${#test_files[@]}"
          for test_file in "${test_files[@]}"; do
            printf 'running %s\n' "$test_file"
            python "$test_file"
          done

      - name: Run offline Method v1.3 drand tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(
            find tools/benchmark-drand/test -maxdepth 1 -type f \
              -name '*v13*.test.mjs' -print | LC_ALL=C sort
          )
          if (( ${#test_files[@]} == 0 )); then
            echo 'no Method v1.3 drand tests found' >&2
            exit 2
          fi
          node --test "${test_files[@]}"

      - name: Parse every Method v1.3 JSON artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = set(Path('schemas').glob('*v1.3*.json'))
          paths.update(Path('results/benchmark').glob('v1.3*/**/*.json'))
          if not paths:
              raise SystemExit('no Method v1.3 JSON artifacts found')
          for path in sorted(paths, key=lambda item: item.as_posix()):
              with path.open(encoding='utf-8') as stream:
                  json.load(stream)
              print(path.as_posix())
          PY

      - name: Lint authoritative Method v1.3 manifests when present
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          manifests = []
          for path in sorted(Path('results/benchmark').glob('**/*.json'), key=lambda item: item.as_posix()):
              with path.open(encoding='utf-8') as stream:
                  value = json.load(stream)
              if isinstance(value, dict) and value.get('schema_version') == 'c5k4-benchmark-1.3':
                  manifests.append(path)

          if not manifests:
              print('no authoritative Method v1.3 benchmark manifest is present')
          for manifest in manifests:
              print(f'linting {manifest.as_posix()}')
              subprocess.run(
                  [sys.executable, 'scripts/lint_benchmark_v13.py', manifest.as_posix()],
                  check=True,
              )
          PY
