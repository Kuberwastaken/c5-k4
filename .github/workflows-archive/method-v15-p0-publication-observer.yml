name: Method v1.5 P0/A0 publication observer

on:
  push:
    branches: [method-v1.5-p0]
    paths:
      - results/benchmark/v1.5-p0-a0/P0A.json
      - results/benchmark/v1.5-p0-a0/P0T.json
      - results/benchmark/v1.5-p0-a0/A0.json

permissions:
  contents: read

jobs:
  verify-exact-publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.9
      - name: Install pinned offline-verifier dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            attrs==24.2.0 cryptography==44.0.1 jsonschema==3.2.0 \
            pyrsistent==0.20.0 setuptools==75.8.0 six==1.16.0
      - name: Verify exact first-attempt publication
        shell: bash
        env:
          EXPECTED_BRANCH: method-v1.5-p0
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#changed[@]}" = "1"
          case "${changed[0]}" in
            results/benchmark/v1.5-p0-a0/P0A.json) stage=p0a ;;
            results/benchmark/v1.5-p0-a0/P0T.json) stage=p0t ;;
            results/benchmark/v1.5-p0-a0/A0.json) stage=a0-observer ;;
            *) exit 1 ;;
          esac
          python3 scripts/verify_benchmark_v15_p0_a0_publication.py \
            --stage "$stage" --commit "$GITHUB_SHA"
