name: TxGraffiti product conjecture v2 DEVELOPMENT

on:
  workflow_dispatch:
    inputs:
      campaign_commit:
        description: Exact frozen 40-hex commit to evaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  exact-arm:
    strategy:
      fail-fast: false
      matrix:
        arm: [CATALOGUE, GENERIC, WALL_NAVIGATION]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - name: Reject movable execution ref
        shell: bash
        env:
          CAMPAIGN_COMMIT: ${{ inputs.campaign_commit }}
        run: |
          set -euo pipefail
          [[ "$CAMPAIGN_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact frozen commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.campaign_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify clean pinned checkout
        shell: bash
        env:
          CAMPAIGN_COMMIT: ${{ inputs.campaign_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CAMPAIGN_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.9'

      - name: Install pinned dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check networkx==3.2.1

      - name: Verify freeze and constructor-only tests
        shell: bash
        run: |
          python results/expansion/live-search-2026-08-14/txgraffiti-product-v2-development/verify_freeze.py
          PYTHONPATH=scripts python -m unittest scripts/test_txgraffiti_product_conjecture_v2.py

      - name: Run one exact v2 arm under hard cap
        id: search
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/txgraffiti-product-v2/$ARM"
          mkdir -p "$output"
          /usr/bin/time -v -o "$output/resources.txt" \
            timeout --signal=TERM --kill-after=5s 60s \
              python scripts/search_txgraffiti_product_conjecture_v2.py \
                --arm "$ARM" \
                --ledger "$output/ledger.jsonl" \
                --terminal "$output/terminal.json" \
                --certificate "$output/certificate.json" \
                --source-attestation results/expansion/live-search-2026-08-14/txgraffiti-product-v2-development/source-status-attestation.json \
                --internal-seconds 54 \
              > "$output/stdout.txt" 2> "$output/stderr.txt"
          code=$?
          printf '{"campaign_commit":"%s","arm":"%s","exit_code":%s}\n' \
            '${{ inputs.campaign_commit }}' "$ARM" "$code" > "$output/assignment.json"
          if test -f "$output/certificate.json"; then
            PYTHONPATH=scripts timeout --signal=TERM --kill-after=5s 60s \
              python scripts/verify_txgraffiti_product_v2_certificate.py "$output/certificate.json" \
              > "$output/certificate-replay.txt"
            replay_code=$?
            if test "$replay_code" -ne 0; then code="$replay_code"; fi
          fi
          (cd "$output" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload complete incremental record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: txgraffiti-product-v2-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arm }}
          path: ${{ runner.temp }}/txgraffiti-product-v2/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
