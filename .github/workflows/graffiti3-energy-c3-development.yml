name: Graffiti3 energy C3 development search

on:
  workflow_dispatch:
    inputs:
      campaign_commit:
        description: Exact frozen 40-hex commit to evaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate-arm:
    strategy:
      fail-fast: false
      matrix:
        arm: [CATALOGUE, GENERIC, WALL_NAVIGATION]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      TZ: UTC
      SOURCE_COMMIT: e37126da53b84150d142a5d61202b61f78521fcc
      SOURCE_CSV_SHA256: 4f455fbfe1149c2ca952b429c7ca9d9c1aae192309fbb642be2b12a345526e97
    steps:
      - name: Reject a movable execution ref
        shell: bash
        env:
          CAMPAIGN_COMMIT: ${{ inputs.campaign_commit }}
        run: |
          set -euo pipefail
          [[ "$CAMPAIGN_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact frozen campaign commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.campaign_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean checkout
        shell: bash
        env:
          CAMPAIGN_COMMIT: ${{ inputs.campaign_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CAMPAIGN_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.9'

      - name: Install pinned scientific dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check networkx==3.2.1 numpy==1.26.4 sympy==1.13.3

      - name: Fetch immutable source calibration table
        shell: bash
        run: |
          set -euo pipefail
          source_csv="$RUNNER_TEMP/expressive_graph_data.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/RandyRDavila/TxGraffiti2/$SOURCE_COMMIT/expressive_graph_data.csv" \
            --output "$source_csv"
          echo "$SOURCE_CSV_SHA256  $source_csv" | sha256sum --check --strict

      - name: Run constructor/control-only tests and freeze verifier
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python -m unittest scripts/test_graffiti3_energy_c3.py
          python scripts/verify_graffiti3_energy_c3.py --root "$GITHUB_WORKSPACE"

      - name: Run one frozen arm under hard cap
        id: search
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
          CAMPAIGN_COMMIT: ${{ inputs.campaign_commit }}
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/graffiti3-energy-c3/$ARM"
          mkdir -p "$output"
          /usr/bin/time -v -o "$output/resources.txt" \
            timeout --signal=TERM --kill-after=5s 60s \
              python scripts/search_graffiti3_energy_c3.py \
                --arm "$ARM" \
                --source-csv "$RUNNER_TEMP/expressive_graph_data.csv" \
                --output "$output/ledger.jsonl" \
                --terminal "$output/terminal.json" \
                --candidate "$output/candidate.json" \
                --campaign-commit "$CAMPAIGN_COMMIT" \
                --internal-seconds 54 \
              > "$output/stdout.txt" 2> "$output/stderr.txt"
          code=$?
          verification_code=0
          if test -f "$output/terminal.json"; then
            verifier=(python scripts/verify_graffiti3_energy_c3.py
              --ledger "$output/ledger.jsonl" --terminal "$output/terminal.json")
            if test -f "$output/candidate.json"; then
              verifier+=(--candidate "$output/candidate.json")
            fi
            "${verifier[@]}" || verification_code=$?
          elif test "$code" -eq 0; then
            echo "search exited successfully without a terminal receipt" >&2
            verification_code=2
          fi
          if test "$verification_code" -ne 0; then
            code="$verification_code"
          fi
          printf '{"campaign_commit":"%s","arm":"%s","exit_code":%s}\n' \
            "$CAMPAIGN_COMMIT" "$ARM" "$code" > "$output/assignment.json"
          (
            cd "$output"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload complete incremental arm record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graffiti3-energy-c3-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arm }}
          path: ${{ runner.temp }}/graffiti3-energy-c3/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
