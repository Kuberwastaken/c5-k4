# SCHEDULE DISABLED 2026-08-15. This job fetched
# `refs/heads/method-v1.5-checkpoints`, a publication branch that was never
# created on origin, so `git fetch` exited 2 and the job failed on every
# nightly run since it was added — it has never once succeeded. Disabling the
# cron stops a standing red signal that carried no information.
#
# Editing this file necessarily changes its own sha256, which the job compares
# against `.frozen.workflow_sha256` in the invocation contract. That freeze is
# therefore void as of this commit and is NOT silently re-pinned; re-activating
# this job means re-deriving the contract along with the publication branch and
# its u1 receipt, deliberately, as part of activating the benchmark.
#
# Manual dispatch is retained so the job can still be exercised on purpose.
name: Method v1.5 scheduled checkpoint

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: method-v15-checkpoint-publication
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: '0'
      TZ: UTC
      CONTRACT_PATH: results/benchmark/v1.5-protocol/checkpoint-invocation-contract.json
    steps:
      - name: Check out the scheduled default-branch state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fail closed before the P1 freeze
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/test_benchmark_v15_checkpoint_workflow_contract.py \
            --workflow .github/workflows/method-v15-checkpoint.yml \
            --contract "$CONTRACT_PATH" \
            --runtime >/dev/null 2>&1
          python3 - "$CONTRACT_PATH" "$EVENT_NAME" "$RUN_ATTEMPT" <<'PY'
          import json, re, sys
          from pathlib import Path

          contract = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if contract.get("status") != "FROZEN_P1_EXECUTABLE":
              raise SystemExit("Method v1.5 checkpointing is not frozen; refusing execution")
          if sys.argv[2] != "schedule" or sys.argv[3] != "1":
              raise SystemExit("only the original schedule event is a valid checkpoint")
          runner = contract.get("runner", {})
          if not re.fullmatch(r"[0-9a-f]{64}", str(runner.get("sha256", ""))):
              raise SystemExit("checkpoint runner is not content-addressed")
          PY

      - name: Load the append-only chain and authenticate the frozen protocol
        id: chain
        shell: bash
        run: |
          set -euo pipefail
          publication_branch=$(jq -er '.publication.branch' "$CONTRACT_PATH")
          u1_path=$(jq -er '.inputs.u1_receipt_path' "$CONTRACT_PATH")
          git fetch --no-tags origin \
            "refs/heads/${publication_branch}:refs/remotes/origin/${publication_branch}"
          public_ref="refs/remotes/origin/${publication_branch}"
          checkpoint_tree="$RUNNER_TEMP/method-v15-checkpoints"
          git worktree add --detach "$checkpoint_tree" "$public_ref" >/dev/null
          test -f "$checkpoint_tree/$u1_path"

          frozen_commit=$(jq -er '.p1.p1r_commit' "$checkpoint_tree/$u1_path")
          [[ "$frozen_commit" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "$frozen_commit" >/dev/null
          test "$(git rev-parse HEAD)" = "$frozen_commit"

          expected_workflow=$(jq -er '.frozen.workflow_sha256' "$CONTRACT_PATH")
          actual_workflow=$(sha256sum .github/workflows/method-v15-checkpoint.yml | awk '{print $1}')
          test "$actual_workflow" = "$expected_workflow"
          chain_proof="$RUNNER_TEMP/method-v15-public-chain-proof.json"
          validation_input_path=$(jq -er '.p1.validation_input.path' "$checkpoint_tree/$u1_path")
          validation_input_sha256=$(jq -er '.p1.validation_input.sha256' "$checkpoint_tree/$u1_path")
          [[ "$validation_input_sha256" =~ ^[0-9a-f]{64}$ ]]
          test -f "$GITHUB_WORKSPACE/$validation_input_path"
          validation_input="$RUNNER_TEMP/method-v15-candidate-validation-input.json"
          cp --no-preserve=mode,ownership "$GITHUB_WORKSPACE/$validation_input_path" "$validation_input"
          chmod 0444 "$validation_input"
          test "$(sha256sum "$validation_input" | awk '{print $1}')" = "$validation_input_sha256"
          python3 scripts/verify_benchmark_v15_public_checkpoint_chain.py \
            --repository "$GITHUB_WORKSPACE" --ref "$public_ref" \
            --p1r-commit "$frozen_commit" \
            --validation-input "$validation_input" \
            --validation-input-sha256 "$validation_input_sha256" \
            --output "$chain_proof"
          chain_tip=$(jq -er '.public_tip_commit' "$chain_proof")
          test "$(git -C "$checkpoint_tree" rev-parse HEAD)" = "$chain_tip"
          if [[ "$(jq -er '.terminal' "$chain_proof")" = true ]]; then
            echo 'The Git-authenticated checkpoint chain is terminal; no later checkpoint will run.'
            echo 'terminal=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scheduled_for=$(jq -er '.next_checkpoint.scheduled_for_utc' "$chain_proof")
          checkpoint_mode=$(python3 - "$scheduled_for" <<'PY'
          import sys
          from datetime import datetime, timezone

          expected = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          deadline = expected.replace(hour=6, minute=0, second=0, microsecond=0)
          if now < expected:
              raise SystemExit("scheduled workflow predates the Git-authenticated next tick")
          print("CAPTURE" if now < deadline else "TERMINAL_CHRONOLOGY_GAP")
          PY
          )
          label=${scheduled_for//:/-}
          destination="checkpoints/$label"
          test ! -e "$checkpoint_tree/$destination"
          {
            echo 'terminal=false'
            echo "frozen_commit=$frozen_commit"
            echo "checkpoint_tree=$checkpoint_tree"
            echo "u1_receipt=$checkpoint_tree/$u1_path"
            echo "scheduled_for=$scheduled_for"
            echo "destination=$destination"
            echo "chain_proof=$chain_proof"
            echo "chain_tip=$chain_tip"
            echo "checkpoint_mode=$checkpoint_mode"
          } >> "$GITHUB_OUTPUT"

      - name: Request one bounded publication from the controlled harness
        if: steps.chain.outputs.terminal == 'false'
        shell: bash
        env:
          SCHEDULED_FOR: ${{ steps.chain.outputs.scheduled_for }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLIC_CHAIN_PROOF: ${{ steps.chain.outputs.chain_proof }}
          CHAIN_TIP: ${{ steps.chain.outputs.chain_tip }}
          FROZEN_COMMIT: ${{ steps.chain.outputs.frozen_commit }}
          CHECKPOINT_MODE: ${{ steps.chain.outputs.checkpoint_mode }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/method-v15-publication"
          mkdir -p "$output"
          if [[ "$CHECKPOINT_MODE" != CAPTURE && "$CHECKPOINT_MODE" != TERMINAL_CHRONOLOGY_GAP ]]; then
            echo 'Unrecognized frozen checkpoint mode.' >&2
            exit 2
          fi

          request="$RUNNER_TEMP/method-v15-target-blind-request.json"
          python3 - "$PUBLIC_CHAIN_PROOF" "$request" <<'PY'
          import json, os, sys
          from pathlib import Path

          proof = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          request = {
              "schema": "c5k4-method-v1.5-target-blind-checkpoint-request-1.0",
              "protocol_version": "1.5",
              "scheduled_for_utc": os.environ["SCHEDULED_FOR"],
              "mode": os.environ["CHECKPOINT_MODE"],
              "public_chain_proof_sha256": proof["proof_sha256"],
              "public_tip_commit": os.environ["CHAIN_TIP"],
              "p1r_commit": os.environ["FROZEN_COMMIT"],
              "p1r_activation_sha256": proof["p1r_activation_sha256"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
          }
          raw = (json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n").encode()
          Path(sys.argv[2]).write_bytes(raw)
          PY
          request_sha=$(sha256sum "$request" | awk '{print $1}')
          harness_url=$(jq -er '.controlled_harness.https_endpoint' "$CONTRACT_PATH")
          harness_pin=$(jq -er '.controlled_harness.tls_spki_sha256' "$CONTRACT_PATH")
          audience_prefix=$(jq -er '.controlled_harness.oidc_audience_prefix' "$CONTRACT_PATH")
          audience="${audience_prefix}:${request_sha}"
          encoded_audience=$(python3 - "$audience" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=""))
          PY
          )
          oidc_response="$RUNNER_TEMP/method-v15-oidc-response.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" \
            -o "$oidc_response" 2>"$RUNNER_TEMP/method-v15-oidc.stderr"
          oidc_token=$(jq -er '.value' "$oidc_response")
          response="$RUNNER_TEMP/method-v15-bounded-response.json"
          max_response_bytes=$(jq -er '.controlled_harness.max_response_bytes' "$CONTRACT_PATH")
          max_response_seconds=$(jq -er '.controlled_harness.max_response_seconds' "$CONTRACT_PATH")
          if ! curl --fail --silent --show-error --pinnedpubkey "$harness_pin" \
            --max-filesize "$max_response_bytes" --max-time "$max_response_seconds" \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' \
            -H "X-C5K4-Request-SHA256: $request_sha" \
            --data-binary "@$request" "$harness_url" -o "$response" \
            2>"$RUNNER_TEMP/method-v15-harness.stderr"; then
            echo 'The controlled checkpoint harness failed closed; diagnostics were not published.' >&2
            exit 2
          fi
          python3 - "$response" "$output" "$request_sha" <<'PY'
          import json, sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          names = ["publication-manifest.json", "quota-certificate.json", "receipt.json"]
          if not isinstance(response, dict) or sorted(response) != sorted(names):
              raise SystemExit("controlled harness response is not the exact bounded triplet")
          forbidden = {"cluster_id", "declarations", "records", "statement", "statement_text", "target_identity"}
          def check(value):
              if isinstance(value, dict):
                  if forbidden.intersection(value):
                      raise SystemExit("controlled harness response contains target-bearing data")
                  for child in value.values(): check(child)
              elif isinstance(value, list):
                  for child in value: check(child)
          manifest = response["publication-manifest.json"]
          if manifest.get("request_sha256") != sys.argv[3]:
              raise SystemExit("bounded response is not bound to the signed request")
          for name in names:
              value = response[name]
              check(value)
              (Path(sys.argv[2]) / name).write_text(
                  json.dumps(value, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Validate and append the bounded publication
        if: steps.chain.outputs.terminal == 'false'
        shell: bash
        env:
          CHECKPOINT_TREE: ${{ steps.chain.outputs.checkpoint_tree }}
          DESTINATION: ${{ steps.chain.outputs.destination }}
          CHAIN_TIP: ${{ steps.chain.outputs.chain_tip }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/method-v15-publication"
          mapfile -t files < <(find "$source_dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(publication-manifest.json quota-certificate.json receipt.json)
          [[ "${files[*]}" = "${expected[*]}" ]]
          python3 - "$source_dir" <<'PY'
          import json, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          forbidden = {"cluster_id", "declarations", "records", "statement", "statement_text", "target_identity"}
          def walk(value):
              if isinstance(value, dict):
                  if forbidden.intersection(value):
                      raise SystemExit("publication contains a forbidden target-bearing field")
                  for child in value.values(): walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          for path in sorted(root.glob("*.json")):
              walk(json.loads(path.read_text(encoding="utf-8")))
          PY
          mkdir "$CHECKPOINT_TREE/$DESTINATION"
          cp "$source_dir"/*.json "$CHECKPOINT_TREE/$DESTINATION/"
          cd "$CHECKPOINT_TREE"
          test "$(git rev-parse HEAD)" = "$CHAIN_TIP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DESTINATION"
          changed=$(git diff --cached --name-only)
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 3
          if printf '%s\n' "$changed" | grep -Ev "^${DESTINATION}/(publication-manifest|quota-certificate|receipt)\.json$"; then
            echo 'append-only publication path check failed' >&2
            exit 2
          fi
          git commit -m "method: append v1.5 checkpoint ${DESTINATION#checkpoints/}" >/dev/null
          git push --atomic origin "HEAD:refs/heads/$(jq -er '.publication.branch' "$GITHUB_WORKSPACE/$CONTRACT_PATH")"
